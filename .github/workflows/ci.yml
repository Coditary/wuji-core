name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Verify module
        run: go mod verify

      - name: Build core binaries
        run: make build

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

  proto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: bufbuild/buf-setup-action@v1.33.0

      - name: Lint protos
        run: buf lint

      - name: Check generated code
        run: |
          buf generate
          git diff --exit-code api/proto/v1/
