run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
  disable:
    - unused

issues:
  exclude-dirs:
    - api/proto/v1
  exclude-rules:
    - path: pkg/driver/image_proto\.go
      linters:
        - staticcheck
      text: "SA1019:"
    - path: _test\.go
      linters:
        - errcheck
